{% import "macros.html" as macros %}
<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="utf-8">
    <title>{{ config.title }}</title>
    <link rel="stylesheet" href="/style.css">


    <link rel="webmention" href="https://webmention.io/{{config.extra.url}}/webmention" />

    {% block rss %}
      <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ get_url(path="rss.xml", trailing_slash=false) }}">
    {% endblock %}

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 80 85%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23a1a1a1%22>⌬</text></svg>">
</head>

<body>

  <div id="dappled-light">
    <div id="glow"></div>
    <div id="glow-bounce"></div>
    <div class="perspective">
      <div id="blinds">
        <div class="shutters">
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
        </div>
      </div>
    </div>
    <div id="progressive-blur">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

    {% block content %} {% endblock %}

<footer>
  {% block footer %}
  <p>
  <a href="/" >Main</a>
  <a href="/rss.xml">Feed</a>
  <a href="/author" >Author</a>
  <a href="/nexus" >Nexus</a>
  <a href="/now" >Now</a>
  </p>
  {% endblock footer %}
</footer>

{% set main_section = get_section(path="_index.md") %}
{{ macros::archives(pages=main_section.pages) }}



</body>

</html>
